<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사내 도구 연습장</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>사내 도구 연습장</h1></header>
  <main>
    <section>
      <h2>할 일</h2>
      <form id="add-form">
        <input id="todo-input" type="text" placeholder="할 일을 입력하세요" required>
        <input id="due-input" type="date" aria-label="마감일">
        <button type="submit">추가</button>
      </form>
      <ul id="todo"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
